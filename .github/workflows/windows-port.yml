name: Windows port validation
on:
  push:
    branches: [codex/windows-native-port]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-port.yml'
      - 'scripts/audit_release.py'
      - 'scripts/tests/test_audit_release.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Native validation (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject profile data, credentials and unpinned dependencies
        run: |
          python scripts/audit_release.py source --report "${{ runner.temp }}/SECURITY-source.json"
          if ($LASTEXITCODE) { throw 'Source privacy audit failed' }
          python -m unittest discover -s scripts/tests -p test_audit_release.py -v
          if ($LASTEXITCODE) { throw 'Privacy boundary tests failed' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build deterministic reference zlib
        shell: pwsh
        run: ./windows/build-zlib.ps1 -Rid ${{ matrix.rid }}
      - name: Wire and cryptography interoperability
        shell: pwsh
        run: dotnet run --project windows/BitChat.InteropTests -c Release
      - name: Publish unsigned self-contained application
        shell: pwsh
        run: dotnet publish windows/BitChat.Windows -c Release -r ${{ matrix.rid }} -o windows/publish/${{ matrix.rid }}
      - name: Exercise native dependencies and render the UI
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "BitChat-${{ matrix.rid }}.json"
          $exe = Join-Path $env:GITHUB_WORKSPACE "windows/publish/${{ matrix.rid }}/BitChat.exe"
          $audit = Join-Path $env:RUNNER_TEMP 'SECURITY-${{ matrix.rid }}.json'
          python scripts/audit_release.py windows --root "windows/publish/${{ matrix.rid }}" --rid ${{ matrix.rid }} --report $audit
          if ($LASTEXITCODE) { throw 'Unexpected files in release payload' }
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $report) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if (Test-Path "$report.error.txt") { Get-Content "$report.error.txt" }
          if ($p.ExitCode -ne 0) { throw "BitChat native self-test failed: $($p.ExitCode)" }
          if (!(Test-Path $report)) { throw "The native process did not produce a diagnostic report" }
          python scripts/audit_release.py windows --root "windows/publish/${{ matrix.rid }}" --rid ${{ matrix.rid }} --compare $audit
          if ($LASTEXITCODE) { throw 'Native tests modified the release payload' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-security-${{ matrix.rid }}
          path: ${{ runner.temp }}/SECURITY-*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics-${{ matrix.rid }}
          path: ${{ runner.temp }}/BitChat-${{ matrix.rid }}.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: BitChat-${{ matrix.rid }}
          path: windows/publish/${{ matrix.rid }}/
